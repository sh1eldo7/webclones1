name: Daily Webpage Clone

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC
  workflow_dispatch: # Allows you to run it manually

jobs:
  clone-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Target Webpage
      run: |
        # Reset tracking folders
        rm -rf docs
        mkdir -p docs/raw
        
        # 1. DOWNLOAD THE RENDERED SITE (with local converted links)
        wget --directory-prefix=docs \
             --recursive \
             --level=2 \
             --page-requisites \
             --adjust-extension \
             --convert-links \
             --no-parent \
             --no-host-directories \
             "https://justinlauer.net" || true

        # 2. DOWNLOAD THE RAW UNMODIFIED CONTENT
        # Grabs the raw homepage source code exactly as the server sends it
        curl -sL "https://justinlauer.net" -o docs/raw/index.html
        
        # Grabs the raw subpage source code exactly as the server sends it
        curl -sL "https://justinlauer.netassignmentsSCU.html" -o docs/raw/assignmentsSCU.html

    - name: Commit and Push Changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add docs/
        git commit -m "Automated daily clone and raw download" || exit 0
        git push

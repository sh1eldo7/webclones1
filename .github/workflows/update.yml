name: Daily Webpage Clone

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC
  workflow_dispatch: # Allows you to run it manually

jobs:
  clone-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Target Webpage
      run: |
        # Clear out old deployments safely
        rm -rf docs
        mkdir docs
        
        # Pull down the index and subpages directly without internal conversion crashes
        wget --directory-prefix=docs --page-requisites --adjust-extension --no-parent --no-host-directories --level=1 "https://justinlauer.net" || true
        
        # Ensure index.html exists in case it was saved under a variant query path
        if [ ! -f "docs/index.html" ] && [ -f "docs/index" ]; then
          mv docs/index docs/index.html
        fi

    - name: Commit and Push Changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add docs/
        git commit -m "Automated daily clone update" || exit 0
        git push

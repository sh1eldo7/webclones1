name: Daily Webpage Clone

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC
  workflow_dispatch: # Allows you to run it manually

jobs:
  clone-and-deploy:
    runs-on: ubuntu-latest
    
    # This block explicitly opens write access for this job
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Target Webpage
      run: |
        rm -rf docs
        mkdir docs
        
        # Install httrack to handle full site copying without crashing
        sudo apt-get update && sudo apt-get install -y httrack
        
        # Mirror the full site assets directly into the docs folder root
        # Using -N0 tells HTTrack to drop all files cleanly without subfolders
        httrack "https://justinlauer.net" -O docs -W -N0 +*.html +*.css +*.js +*.png +*.jpg +*.gif
        
        # Clean up httrack system log files so they aren't pushed to your site
        rm -rf docs/hts-cache docs/hts-log.txt docs/backblue.gif

    - name: Commit and Push Changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add docs/
        git commit -m "Automated daily clone update" || exit 0
        git push

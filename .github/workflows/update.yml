name: Daily Webpage Clone

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC
  workflow_dispatch: # Allows you to run it manually

jobs:
  clone-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Target Webpage
      run: |
        rm -rf docs
        mkdir -p docs/raw
        
        # 1. DOWNLOAD RENDERED SITE (With subpage logic)
        # We wrap wget in a subshell ( ) to cleanly isolate and suppress exit code 6
        (wget --directory-prefix=docs --recursive --level=2 --page-requisites --adjust-extension --convert-links --no-parent --no-host-directories "https://justinlauer.net") || echo "Suppressed expected network warnings."

        # 2. DOWNLOAD THE RAW UNMODIFIED CONTENT
        curl -sL "https://justinlauer.net" -o docs/raw/index.html
        curl -sL "https://justinlauer.netassignmentsSCU.html" -o docs/raw/assignmentsSCU.html

    - name: Commit and Push Changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add docs/
        git commit -m "Automated daily clone and raw download" || exit 0
        git push

name: Daily Webpage Clone

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC
  workflow_dispatch: # Allows you to run it manually

jobs:
  clone-and-deploy:
    runs-on: ubuntu-latest
    
    # This block explicitly opens write access for this job
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Target Webpage
      run: |
        rm -rf docs
        mkdir docs
        
        # Install httrack to handle full site copying without crashing
        sudo apt-get update && sudo apt-get install -y httrack
        
        # Mirror the full site safely into your docs folder
        httrack "https://justinlauer.net" -O docs -W -O1 docs +*.html +*.css +*.js +*.png +*.jpg +*.gif
        
        # Move files from the subfolder to the root of /docs so GitHub Pages finds them
        if [ -d "docs/justinlauer.net" ]; then
          mv docs/justinlauer.net/* docs/
          rm -rf docs/justinlauer.net
        fi
        
        # Clean up httrack system log files so they aren't pushed to your site
        rm -f docs/hts-cache/* docs/hts-log.txt

    - name: Commit and Push Changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add docs/
        git commit -m "Automated daily clone update" || exit 0
        git push

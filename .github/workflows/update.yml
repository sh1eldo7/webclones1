name: Daily Webpage Clone

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC
  workflow_dispatch: # Allows you to run it manually

jobs:
  clone-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Clear and Setup Directories
      run: |
        rm -rf docs
        mkdir -p docs/raw

    - name: Download Rendered Site Assets
      run: |
        wget --directory-prefix=docs \
             --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
             --recursive \
             --level=2 \
             --page-requisites \
             --adjust-extension \
             --convert-links \
             --no-parent \
             --no-host-directories \
             "https://justinlauer.net" || true

    - name: Download Raw Home Page Content
      run: curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://justinlauer.net" -o docs/raw/index.html || true

    - name: Download Raw Subpage Content
      run: curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://justinlauer.netassignmentsSCU.html" -o docs/raw/assignmentsSCU.html || true

    - name: Commit and Push Changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add docs/
        git commit -m "Automated daily clone update" || exit 0
        git push

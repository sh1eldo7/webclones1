name: Daily Webpage Clone

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC
  workflow_dispatch: # Allows you to run it manually

jobs:
  clone-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Target Webpage
      run: |
        rm -rf docs
        mkdir docs
        
        # Mirror the target site safely into your docs folder
        # -r activates recursion to find subpages
        # -l 2 allows it to go deep enough to gather the subpage HTML layout files
        # -k rewrites links locally so subpage navigation works seamlessly
        wget --directory-prefix=docs \
             --recursive \
             --level=2 \
             --page-requisites \
             --adjust-extension \
             --convert-links \
             --no-parent \
             --no-host-directories \
             "https://justinlauer.net" || true

    - name: Commit and Push Changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add docs/
        git commit -m "Automated daily clone update" || exit 0
        git push
